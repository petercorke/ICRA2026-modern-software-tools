[workspace]
authors = ["Tobias Fischer <info@tobiasfischer.info>", "Peter Corke <peter.corke@qut.edu.au>"]
channels = ["conda-forge", "https://prefix.dev/github-releases"]
name = "2026 - ICRA - Tutorial Keynote Peter Corke and Tobias Fischer"
platforms = ["linux-64", "osx-arm64", "win-64", "linux-aarch64", "osx-64"]
version = "0.1.0"

[tasks]
# They are terrible workarounds as we initialize a pixi workspace inside the presentation
# If someone has a better idea how to do this, please let me know
# One idea would be to `pixi global install presenterm -c https://prefix.dev/github-releases`
clean_init_pixi = { cmd = "rm ./pixi.toml; rm ./pixi.lock; rm -rf .pixi; pixi init", description = "Clean pixi workspace and reinitialize", cwd = "./tobi" }
prepare_export_markdown = { cmd = "python scripts/prepare_export.py icra_software_tools.md icra_software_tools_export.md", description = "Prepare dark-theme export markdown from presentation", cwd = "./tobi" }
prepare_export_markdown_light = { cmd = "python scripts/prepare_export.py icra_software_tools.md icra_software_tools_export_light.md --theme light", description = "Prepare light-theme export markdown from presentation", cwd = "./tobi" }
export_presentation_pdf = { cmd = "TQDM_DISABLE=1 pixi run presenterm --export-pdf --enable-snippet-execution icra_software_tools_export.md --config-file presenterm_config.yaml --theme terminal-dark", depends-on = ["prepare_export_markdown", "clean_init_pixi"], description = "Export the presentation to PDF (dark theme)", cwd = "./tobi" }
export_presentation_html = { cmd = "TQDM_DISABLE=1 pixi run presenterm --export-html --enable-snippet-execution --image-protocol ascii-blocks icra_software_tools_export.md --config-file presenterm_config.yaml --theme terminal-dark && python add_mobile_navigation.py icra_software_tools_export.html", depends-on = ["prepare_export_markdown", "clean_init_pixi"], description = "Export the presentation to HTML (dark theme)", cwd = "./tobi" }
export_presentation_pdf_light = { cmd = "TQDM_DISABLE=1 pixi run presenterm --export-pdf --enable-snippet-execution icra_software_tools_export_light.md --config-file presenterm_config.yaml --theme terminal-light", depends-on = ["prepare_export_markdown_light", "clean_init_pixi"], description = "Export the presentation to PDF (light theme)", cwd = "./tobi" }
export_presentation_html_light = { cmd = "TQDM_DISABLE=1 pixi run presenterm --export-html --enable-snippet-execution --image-protocol ascii-blocks icra_software_tools_export_light.md --config-file presenterm_config.yaml --theme terminal-light && python add_mobile_navigation.py icra_software_tools_export_light.html", depends-on = ["prepare_export_markdown_light", "clean_init_pixi"], description = "Export the presentation to HTML (light theme)", cwd = "./tobi" }

# Peter's JupyterLite site
remove_large_peter_wheels = { cmd = "python -c \"from pathlib import Path; [p.unlink() for pattern in ('bdsim-*.whl', 'rtb_data-*.whl') for p in Path('.').glob(pattern)]\"", description = "Remove large wheels from Peter's JupyterLite deployment bundle", cwd = "./peter/jupyter-lite/pypi" }
build_part1_jupyterlite = { cmd = "jupyter lite build --contents content/ --base-url /ICRA2026-modern-software-tools/part1/ --output-dir _site", depends-on = ["remove_large_peter_wheels"], description = "Build Peter's JupyterLite site", cwd = "./peter/jupyter-lite" }

prepare_presenterm_manifest = { cmd = "python scripts/prepare_presenterm_manifest.py", description = "Remove missing optional ROS package dependency before presenterm", cwd = "./tobi" }
run_presenterm = { cmd = "TQDM_DISABLE=1 pixi run presenterm --enable-snippet-execution -X icra_software_tools.md --config-file presenterm_config.yaml --theme {{ theme }}", args = [{ arg = "theme", default = "terminal-dark", choices = ["terminal-dark", "terminal-light"] }], depends-on = ["prepare_presenterm_manifest"], description = "Run presenterm presentation", cwd = "./tobi" }
presentation = { cmd = "exit 0", args = [{ arg = "theme", default = "terminal-dark", choices = ["terminal-dark", "terminal-light"] }], depends-on = ["clean_init_pixi", { task = "run_presenterm", args = ["{{ theme }}"] }], description = "Run the presentation", cwd = "./tobi" }
prepare_codespaces = { cmd = "python scripts/prepare_codespaces.py --in-place icra_software_tools.md --config-file presenterm_config.yaml", description = "Apply Codespaces keybinding and port guidance to the presentation", cwd = "./tobi" }
presentation_codespaces = { cmd = "exit 0", args = [{ arg = "theme", default = "terminal-dark", choices = ["terminal-dark", "terminal-light"] }], depends-on = ["prepare_codespaces", "clean_init_pixi", { task = "run_presenterm", args = ["{{ theme }}"] }], description = "Run the presentation with Codespaces overrides applied", cwd = "./tobi" }


[target.win-64.tasks]
presentation_windows_markdown = { cmd = "python scripts/prepare_windows.py icra_software_tools.md icra_software_tools_windows.md", description = "Generate the Windows presentation markdown", cwd = "./tobi" }

run_presenterm = { cmd = "TQDM_DISABLE=1 pixi run presenterm --enable-snippet-execution -X icra_software_tools_windows.md --config-file presenterm_config.yaml --theme {{ theme }}", args = [{ arg = "theme", default = "terminal-dark", choices = ["terminal-dark", "terminal-light"] }], depends-on = ["presentation_windows_markdown", "prepare_presenterm_manifest"], description = "Run presenterm Windows presentation", cwd = "./tobi" }
presentation = { cmd = "exit /b 0", args = [{ arg = "theme", default = "terminal-dark", choices = ["terminal-dark", "terminal-light"] }], depends-on = ["clean_init_pixi", { task = "run_presenterm", args = ["{{ theme }}"] }], description = "Run the Windows presentation", cwd = "./tobi" }

[dependencies]
presenterm = ">=0.16.1"
jupyterlab = ">=4.0.0"
python = "3.13.*"
weasyprint = "*"
jupyterlite-core = ">=0.7,<0.8"
jupyterlite-pyodide-kernel = ">=0.7,<0.8"
jupyter_server = "*"
actionlint = "*"

[feature.part1-pdf]
platforms = ["linux-64", "osx-arm64"]

[feature.part1-pdf.tasks]
export_part1_notebooks_pdf = { cmd = "rm -rf _artifacts/part1-pdfs _artifacts/part1-notebooks-pdf.zip && python peter/jupyter-lite/content/makepdf.py && cd _artifacts/part1-pdfs && zip -r ../part1-notebooks-pdf.zip ./*.pdf", description = "Export Peter's Part 1 notebooks to a PDF zip" }

[feature.part1-pdf.dependencies]
python = "3.12.*"
ipykernel = "*"
nbconvert-core = "*"
nbformat = "*"
pandoc = "*"
zip = "*"
quadprog = "*"

[feature.part1-pdf.pypi-dependencies]
bdsim = "*"
machinevision-toolbox-python = "*"
pgraph-python = "*"
rtb-data = "*"
spatialmath-python = { git = "https://github.com/petercorke/spatialmath-python.git", branch = "good" }
roboticstoolbox-python = { git = "https://github.com/petercorke/robotics-toolbox-python.git", branch = "future" }
spatialgeometry = { git = "https://github.com/jhavl/spatialgeometry.git", branch = "future" }

[environments]
part1-pdf = { features = ["part1-pdf"], no-default-feature = true }

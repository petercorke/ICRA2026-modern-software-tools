name: Build and publish tutorial site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build complete site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true

      - name: Build Part 1 JupyterLite site
        run: pixi run build_part1_jupyterlite

      - name: Export Part 2 HTML
        run: pixi run export_presentation_html

      - name: Export Part 2 PDF
        run: pixi run export_presentation_pdf

      - name: Assemble Pages site
        run: |
          mkdir -p _site/part1 _site/part2
          cp -r peter/jupyter-lite/_site/. _site/part1/
          cp tobi/icra_software_tools_export.html _site/part2/index.html
          cp tobi/icra_software_tools_export.pdf _site/part2/icra_software_tools_export.pdf
          cp peter/landing/index.html _site/index.html

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: part2-presentation-pdf
          path: tobi/icra_software_tools_export.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

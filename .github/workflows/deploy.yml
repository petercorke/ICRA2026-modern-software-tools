name: Build and publish tutorial site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build complete site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true

      - name: Build Part 1 JupyterLite site
        run: pixi run build_part1_jupyterlite

      # - name: Install Part 1 PDF export dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y --no-install-recommends \
      #       texlive-latex-base \
      #       texlive-xetex \
      #       texlive-fonts-recommended \
      #       texlive-plain-generic \
      #       pandoc \
      #       zip

      # - name: Install Part 1 toolbox packages from PyPI
      #   run: |
      #     # Pixi's Python environment may not include pip by default.
      #     pixi run python - <<'PY'
      #     import importlib.util
      #     import subprocess
      #     import sys
      #     import tempfile
      #     import urllib.request
      #
      #     if importlib.util.find_spec("pip") is None:
      #         try:
      #             import ensurepip
      #             ensurepip.bootstrap(upgrade=True)
      #         except Exception:
      #             url = "https://bootstrap.pypa.io/get-pip.py"
      #             with tempfile.NamedTemporaryFile(suffix=".py") as f:
      #                 f.write(urllib.request.urlopen(url).read())
      #                 f.flush()
      #                 subprocess.check_call([sys.executable, f.name])
      #     PY
      #
      #     pixi run python -m pip install --upgrade pip
      #     pixi run python -m pip install --upgrade \
      #       bdsim \
      #       machinevision-toolbox-python \
      #       robotics-toolbox-python \
      #       spatialmath-python

      # - name: Export Part 1 notebooks to PDF zip
      #   run: |
      #     mkdir -p _artifacts/part1-pdfs
      #     for nb in peter/jupyter-lite/content/*.ipynb; do
      #       pixi run jupyter nbconvert "$nb" \
      #         --to pdf \
      #         --execute \
      #         --output-dir _artifacts/part1-pdfs \
      #         --PDFExporter.latex_command="['xelatex', '{filename}', '-interaction=nonstopmode']" \
      #         --TagRemovePreprocessor.enabled=True \
      #         --TagRemovePreprocessor.remove_cell_tags="['skip-execution', 'skip-nbconvert']"
      #     done
      #     cd _artifacts/part1-pdfs
      #     zip -r ../part1-notebooks-pdf.zip ./*.pdf

      - name: Export Part 2 HTML (dark theme)
        run: pixi run export_presentation_html

      - name: Export Part 2 PDF (dark theme)
        run: pixi run export_presentation_pdf

      - name: Export Part 2 HTML (light theme)
        run: pixi run export_presentation_html_light

      - name: Export Part 2 PDF (light theme)
        run: pixi run export_presentation_pdf_light

      - name: Assemble Pages site
        run: |
          mkdir -p _site/part1 _site/part2
          cp -r peter/jupyter-lite/_site/. _site/part1/
          # cp _artifacts/part1-notebooks-pdf.zip _site/part1/part1-notebooks-pdf.zip
          cp tobi/icra_software_tools_export.html _site/part2/index.html
          cp tobi/icra_software_tools_export.pdf _site/part2/icra_software_tools_export.pdf
          cp tobi/icra_software_tools_export_light.html _site/part2/index_light.html
          cp tobi/icra_software_tools_export_light.pdf _site/part2/icra_software_tools_export_light.pdf
          cp peter/landing/index.html _site/index.html

      - name: Upload PDF artifact (dark theme)
        uses: actions/upload-artifact@v7
        with:
          name: part2-presentation-pdf-dark
          path: tobi/icra_software_tools_export.pdf
          if-no-files-found: error

      - name: Upload PDF artifact (light theme)
        uses: actions/upload-artifact@v7
        with:
          name: part2-presentation-pdf-light
          path: tobi/icra_software_tools_export_light.pdf
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
